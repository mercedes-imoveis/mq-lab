name: mq-requeue
# Requeue robot (docs/specs/ci-gate-fila-de-merge.md section 5). Runs from the DEFAULT branch only
# (pull_request_target / workflow_run) and never checks out PR code.
on:
  pull_request_target:
    types: [dequeued]
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

# One sweep at a time, never cancelled: each sweep re-reads the whole state, so a pending one can be replaced.
concurrency:
  group: mq-requeue
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: sweep
        env:
          GH_TOKEN: ${{ secrets.MQ_ROBOT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/mergeQueue/sweep.mjs
